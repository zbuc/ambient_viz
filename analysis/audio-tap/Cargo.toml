[package]
name = "orrery-audio-tap"
version = "0.1.0"
description = "Audio analysis sidecar: taps the audio plane, publishes audio.main.* onto the orrery bus (AUDIO_ANALYSIS_SIDECAR.md)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Audio sources are cargo features (daisy alias discipline): prod builds
# compile only the source they need; default carries both for dev.
default = ["capture", "file"]
capture = ["dep:cpal"]
file = ["dep:symphonia"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
clap = { version = "4", features = ["derive"] }

cpal = { version = "0.15", optional = true }
symphonia = { version = "0.5", optional = true, default-features = false, features = ["mp3"] }
