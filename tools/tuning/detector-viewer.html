<!doctype html>
<!--
  detector-viewer — the tuning harness's eyes (AUDIO_ANALYSIS_SIDECAR.md).

  LIVE mode (the point): pick the piece's audio file; the browser decodes
  it and runs the SAME Rust detector compiled to WASM (tools/tuning/wasm/,
  built by tools/tuning/build.sh). Every param — band edges, attack/
  release, baseline tau, onset threshold/cooldown — re-analyzes the whole
  piece on change. No JS reimplementation of the DSP; no re-trace command.
  Edit detector.rs -> rerun build.sh to refresh the preview.

  STATIC fallback: load an audiotap-trace.v1 JSON (from
  `orrery-audio-tap --trace-out`) to view without audio/wasm. Params show
  but only threshold/cooldown preview live (JS gate replay over kick_dev).

  Tune by ear: the purple kick_dev trace against the dashed threshold line.
  When it's right, "download detector-params.json" and feed the sidecar
  with `orrery-audio-tap --params`.

  Serve the repo (python3 -m http.server) so the wasm + ?audio= load:
    http://localhost:8000/tools/tuning/detector-viewer.html?audio=/static/20251006_arrangement_1.mp3
  Interaction: click/drag a strip = seek · space = play/pause ·
  wheel on detail = zoom · follow keeps the window on the playhead.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>detector tuning</title>
<style>
  body { background:#101014; color:#cfcfd6; font:13px/1.5 ui-monospace, monospace; margin:14px; }
  h1 { font-size:14px; font-weight:600; margin:0 0 8px; color:#e8e8ee; }
  #bar { display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  #bar label { cursor:pointer; user-select:none; }
  canvas { display:block; width:100%; background:#16161c; border:1px solid #26262e; margin-bottom:8px; }
  .sw { display:inline-block; width:10px; height:10px; margin-right:4px; vertical-align:-1px; }
  input[type=file] { color:#8a8a94; max-width:200px; }
  #t { color:#e8e8ee; min-width:90px; display:inline-block; }
  #editor { display:flex; gap:18px; flex-wrap:wrap; margin-top:8px; align-items:flex-start; }
  .grp { border:1px solid #26262e; padding:6px 9px; border-radius:4px; }
  .grp h2 { font-size:12px; font-weight:600; margin:0 0 4px; color:#b8b8c0; }
  .row { display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .row label { color:#8a8a94; }
  .row input { width:64px; background:#0d0d11; color:#e8e8ee; border:1px solid #33333c; border-radius:3px; padding:1px 4px; font:inherit; text-align:right; }
  #status { margin-top:8px; color:#8a8a94; }
  #status.busy { color:#ffd24a; }
  #status.warn { color:#e8a030; }
  button { background:#2a2a34; color:#e8e8ee; border:1px solid #44444e; border-radius:3px; padding:3px 9px; cursor:pointer; font:inherit; }
  button:disabled { opacity:0.4; cursor:default; }
</style>
</head>
<body>
<h1>detector tuning <span id="t">–</span></h1>
<div id="bar">
  <label>audio <input type="file" id="audioFile" accept="audio/*"></label>
  <label>trace/params <input type="file" id="dataFile" accept=".json"></label>
  <span id="channels"></span>
  <label><input type="checkbox" id="follow" checked> follow</label>
  <button id="download" disabled>download detector-params.json</button>
  <audio id="audio" controls style="height:24px"></audio>
</div>
<canvas id="overview" height="110"></canvas>
<canvas id="detail" height="320"></canvas>
<div id="editor">loading…</div>
<div id="status"></div>
<script type="module">
import init, * as WASM from './wasm/detector.js';

const CHANNELS = [ // [column, color, on-by-default]
  ['kick', '#ff5050', true], ['pad', '#46c878', true], ['lead', '#5a78ff', true],
  ['kick_dev', '#c882ff', true], ['kick_baseline', '#8a5ab4', false],
  ['bass', '#e8a030', false], ['mid', '#b4c83c', false], ['treble', '#3cc8c8', false],
  ['level', '#9a9aa4', false], ['bass_fast', '#ff78b4', false], ['peak', '#e8e8ee', false],
];
const RETRACE_KEYS = new Set(['band_lo', 'band_hi', 'attack_s', 'release_s', 'baseline_tau_s']);

let wasmReady = false;
let td = null;            // { rows:[[...]], onsets:[[t,s]], col:{name:idx}, sr, dur }
let params = null;        // live editor state {kick,pad,lead,onset}
let pcm = null;           // Float32Array mono (live mode)
let sr = 48000;
let mode = 'none';        // 'live' | 'static' | 'none'
let preview = [];         // static-mode JS gate replay (live mode uses td.onsets)
let win = { t0: 0, len: 30 };
let busy = false, debounce = null;

const $ = (id) => document.getElementById(id);
const audio = $('audio'), overview = $('overview'), detail = $('detail');
const on = Object.fromEntries(CHANNELS.map(([n, , d]) => [n, d]));

// ── channel toggles ──────────────────────────────────────────────────────
for (const [name, color] of CHANNELS) {
  const l = document.createElement('label');
  const c = document.createElement('input');
  c.type = 'checkbox'; c.checked = on[name];
  c.onchange = () => { on[name] = c.checked; draw(); };
  const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = color;
  l.append(c, sw, name + ' ');
  $('channels').append(l);
}

// ── wasm + input wiring ──────────────────────────────────────────────────
const q = new URLSearchParams(location.search);
init()
  .then(() => { wasmReady = true; setStatus(); maybeGoLive(); })
  .catch(() => { setStatus('wasm not built — run tools/tuning/build.sh for live tuning (static trace view still works)', 'warn'); });

if (q.get('audio')) loadAudioUrl(q.get('audio'));
if (q.get('params')) fetch(q.get('params')).then(r => r.json()).then(seedParams).catch(() => {});
if (q.get('trace')) fetch(q.get('trace')).then(r => r.json()).then(loadStatic).catch((e) => setStatus('trace fetch failed: ' + e, 'warn'));

$('audioFile').onchange = (e) => { const f = e.target.files[0]; if (f) loadAudioFile(f); };
$('dataFile').onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then((t) => {
    const obj = JSON.parse(t);
    if (obj.schema === 'detector-params.v1') seedParams(obj);
    else if (obj.meta && obj.meta.schema === 'audiotap-trace.v1') loadStatic(obj);
    else setStatus('unrecognized JSON (expect detector-params.v1 or audiotap-trace.v1)', 'warn');
  });
};
$('download').onclick = downloadParams;

function loadAudioUrl(url) {
  audio.src = url;
  fetch(url).then(r => r.arrayBuffer()).then(decodeMono).catch((e) => setStatus('audio fetch failed: ' + e, 'warn'));
}
function loadAudioFile(f) {
  audio.src = URL.createObjectURL(f);
  f.arrayBuffer().then(decodeMono).catch((e) => setStatus('audio decode failed: ' + e, 'warn'));
}
function decodeMono(arrayBuffer) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  return ctx.decodeAudioData(arrayBuffer).then((buf) => {
    sr = buf.sampleRate;
    const n = buf.length, ch = buf.numberOfChannels;
    const mono = new Float32Array(n);
    for (let c = 0; c < ch; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < n; i++) mono[i] += d[i] / ch;
    }
    pcm = mono;
    maybeGoLive();
  });
}

function seedParams(p) {
  // accept a detector-params.v1 (or a trace's meta.params, same shape)
  params = JSON.parse(JSON.stringify(p));
  delete params.schema;
  buildEditor();
  if (mode === 'live') scheduleAnalyze();
  else if (mode === 'static') { recomputePreview(); draw(); }
  setStatus();
}

function maybeGoLive() {
  if (!(wasmReady && pcm)) return;
  mode = 'live';
  if (!params) params = stripSchema(JSON.parse(WASM.default_params()));
  buildEditor();
  $('download').disabled = false;
  runAnalyze();
}
function stripSchema(p) { delete p.schema; return p; }

// ── trace data assembly ──────────────────────────────────────────────────
function makeTd(rows, onsets, cols) {
  return {
    rows, onsets,
    col: Object.fromEntries(cols.map((c, i) => [c, i])),
    dur: rows.length ? rows[rows.length - 1][0] : 1,
  };
}
function loadStatic(obj) {
  mode = pcm && wasmReady ? 'live' : 'static';
  td = makeTd(obj.rows, obj.onsets, obj.meta.columns);
  if (!params) { params = JSON.parse(JSON.stringify(obj.meta.params)); delete params.schema; }
  win = { t0: 0, len: Math.min(30, td.dur) };
  buildEditor();
  $('download').disabled = false;
  if (mode === 'live') runAnalyze(); else { recomputePreview(); setStatus(); draw(); }
}

// ── live analyze (the real DSP, in wasm) ──────────────────────────────────
function paramsJson() {
  return JSON.stringify({ schema: 'detector-params.v1', ...params });
}
function scheduleAnalyze() {
  if (mode !== 'live') return;
  clearTimeout(debounce);
  setStatus('analyzing…', 'busy');
  debounce = setTimeout(runAnalyze, 200);
}
function runAnalyze() {
  if (!(wasmReady && pcm)) return;
  busy = true;
  // let the 'analyzing…' paint before the (blocking) wasm call
  requestAnimationFrame(() => {
    let a;
    try { a = WASM.analyze(pcm, sr, paramsJson()); }
    catch (e) { setStatus('analyze error: ' + e, 'warn'); busy = false; return; }
    const cols = WASM.columns();
    const nc = a.n_cols, nr = a.n_rows, flat = a.rows;
    const rows = new Array(nr);
    for (let i = 0; i < nr; i++) {
      const r = new Array(nc);
      for (let j = 0; j < nc; j++) r[j] = flat[i * nc + j];
      rows[i] = r;
    }
    const onf = a.onsets, onsets = [];
    for (let i = 0; i < onf.length; i += 2) onsets.push([onf[i], onf[i + 1]]);
    td = makeTd(rows, onsets, cols);
    if (win.len > td.dur) win = { t0: 0, len: Math.min(30, td.dur) };
    preview = []; // live: td.onsets ARE the fires
    busy = false;
    setStatus(); draw();
  });
}

// static-mode only: JS replay of the gate over the traced kick_dev
function recomputePreview() {
  preview = [];
  if (!td || mode === 'live') return;
  const ci = td.col.kick_dev, { threshold, cooldown_s } = params.onset;
  let armed = true, until = -Infinity;
  for (const r of td.rows) {
    const t = r[0], dev = r[ci];
    if (!armed) { if (dev < threshold * 0.5) armed = true; continue; }
    if (dev > threshold && t >= until) { until = t + cooldown_s; armed = false; preview.push(t); }
  }
}

// ── editor ────────────────────────────────────────────────────────────────
function buildEditor() {
  const ed = $('editor'); ed.innerHTML = '';
  if (!params) { ed.textContent = 'load audio (live) or a trace JSON (static)…'; return; }
  const num = (group, get, set, key, step) => {
    const wrap = document.createElement('div'); wrap.className = 'row';
    const lab = document.createElement('label'); lab.textContent = key;
    const inp = document.createElement('input');
    inp.type = 'number'; inp.step = step; inp.value = get();
    inp.onchange = () => {
      const v = parseFloat(inp.value); if (!isFinite(v)) return;
      set(v);
      if (mode === 'live') scheduleAnalyze();
      else { recomputePreview(); setStatus(); draw(); }  // static: only threshold/cooldown actually recompute
    };
    wrap.append(lab, inp); return wrap;
  };
  for (const det of ['kick', 'pad', 'lead']) {
    const g = document.createElement('div'); g.className = 'grp';
    g.innerHTML = `<h2>${det}</h2>`;
    g.append(
      num(det, () => params[det].band_hz[0], (v) => params[det].band_hz[0] = v, 'band_lo', 1),
      num(det, () => params[det].band_hz[1], (v) => params[det].band_hz[1] = v, 'band_hi', 1),
      num(det, () => params[det].attack_s, (v) => params[det].attack_s = v, 'attack_s', 0.001),
      num(det, () => params[det].release_s, (v) => params[det].release_s = v, 'release_s', 0.01),
    );
    ed.append(g);
  }
  const g = document.createElement('div'); g.className = 'grp';
  g.innerHTML = '<h2>kick onset</h2>';
  g.append(
    num('onset', () => params.onset.threshold, (v) => params.onset.threshold = v, 'threshold', 0.005),
    num('onset', () => params.onset.cooldown_s, (v) => params.onset.cooldown_s = v, 'cooldown_s', 0.01),
    num('onset', () => params.onset.baseline_tau_s, (v) => params.onset.baseline_tau_s = v, 'baseline_tau_s', 0.1),
  );
  ed.append(g);
}

function setStatus(msg, cls) {
  const s = $('status');
  s.className = cls || '';
  if (msg) { s.textContent = msg; return; }
  if (!td) { s.textContent = wasmReady ? 'wasm ready — pick the piece\'s audio file for live tuning' : ''; return; }
  if (mode === 'live') {
    s.textContent = `LIVE (wasm) · sr ${sr} · ${td.rows.length} rows · ${td.onsets.length} kick fires`
      + (busy ? ' · analyzing…' : ' · drag any param to re-analyze');
  } else {
    const staticKnobs = RETRACE_KEYS.size ? ' (band/attack/release/baseline need live wasm — load audio)' : '';
    s.textContent = `STATIC trace · preview ${preview.length} fires (threshold/cooldown only${staticKnobs})`;
  }
}

function downloadParams() {
  if (!params) return;
  const out = { schema: 'detector-params.v1', kick: params.kick, pad: params.pad, lead: params.lead,
    onset: { threshold: params.onset.threshold, cooldown_s: params.onset.cooldown_s, baseline_tau_s: params.onset.baseline_tau_s } };
  const blob = new Blob([JSON.stringify(out, null, 2) + '\n'], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'detector-params.json'; a.click();
  URL.revokeObjectURL(a.href);
}

// ── drawing ────────────────────────────────────────────────────────────────
function rowsIn(t0, t1) {
  const step = td.rows.length / td.dur;
  return [Math.max(0, Math.floor(t0 * step) - 1), Math.min(td.rows.length, Math.ceil(t1 * step) + 1)];
}
function drawStrip(cv, t0, t1, withThreshold) {
  const ctx = cv.getContext('2d');
  const W = cv.width = cv.clientWidth * devicePixelRatio;
  const H = cv.height = cv.clientHeight * devicePixelRatio;
  ctx.clearRect(0, 0, W, H);
  if (!td) return;
  const x = (t) => (t - t0) / (t1 - t0) * W;
  const y = (v) => H - 4 - Math.max(-0.1, Math.min(1, v)) * (H - 18);
  // fires (live: authoritative; static: from the traced params): red ticks
  ctx.strokeStyle = '#ff5050'; ctx.globalAlpha = 0.8;
  for (const [t, s] of td.onsets) {
    if (t < t0 || t > t1) continue;
    ctx.beginPath(); ctx.moveTo(x(t), 0); ctx.lineTo(x(t), 8 + s * 16); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  if (withThreshold && params) {
    const ty = y(params.onset.threshold);
    if (mode === 'static') { // approximate preview dots along the line
      ctx.fillStyle = '#ffd24a';
      for (const t of preview) { if (t < t0 || t > t1) continue; ctx.beginPath(); ctx.arc(x(t), ty, 2.4, 0, 7); ctx.fill(); }
    }
    ctx.strokeStyle = '#c882ff'; ctx.setLineDash([6, 5]);
    ctx.beginPath(); ctx.moveTo(0, ty); ctx.lineTo(W, ty); ctx.stroke(); ctx.setLineDash([]);
  }
  const [a, b] = rowsIn(t0, t1);
  for (const [name, color] of CHANNELS) {
    if (!on[name] || !(name in td.col)) continue;
    const ci = td.col[name];
    ctx.strokeStyle = color; ctx.lineWidth = name.startsWith('kick') ? 1.6 : 1.1;
    ctx.beginPath();
    for (let i = a; i < b; i++) {
      const r = td.rows[i], px = x(r[0]), py = y(r[ci]);
      if (i === a) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  const t = audio.currentTime;
  if (t >= t0 && t <= t1) {
    ctx.strokeStyle = '#e8e8ee'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x(t), 0); ctx.lineTo(x(t), H); ctx.stroke();
  }
}
function draw() {
  if (!td) return;
  drawStrip(overview, 0, td.dur, false);
  const ctx = overview.getContext('2d');
  ctx.strokeStyle = '#5a5a66';
  ctx.strokeRect(win.t0 / td.dur * overview.width, 0, win.len / td.dur * overview.width, overview.height);
  drawStrip(detail, win.t0, win.t0 + win.len, true);
  $('t').textContent = audio.currentTime.toFixed(2) + 's';
}

// ── interaction ─────────────────────────────────────────────────────────────
const seekFromEvent = (cv, t0, t1) => (e) => {
  if (!td) return;
  const r = cv.getBoundingClientRect();
  audio.currentTime = t0() + (e.clientX - r.left) / r.width * (t1() - t0());
  draw();
};
const ovSeek = seekFromEvent(overview, () => 0, () => td.dur);
const dtSeek = seekFromEvent(detail, () => win.t0, () => win.t0 + win.len);
let dragging = null;
overview.onmousedown = (e) => { dragging = ovSeek; ovSeek(e); };
detail.onmousedown = (e) => { dragging = dtSeek; dtSeek(e); };
window.onmousemove = (e) => { if (dragging) dragging(e); };
window.onmouseup = () => { dragging = null; };
detail.onwheel = (e) => {
  e.preventDefault();
  if (!td) return;
  const mid = win.t0 + win.len / 2;
  win.len = Math.max(5, Math.min(180, win.len * (e.deltaY > 0 ? 1.25 : 0.8)));
  win.t0 = Math.max(0, Math.min(td.dur - win.len, mid - win.len / 2));
  draw();
};
window.onkeydown = (e) => {
  if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); audio.paused ? audio.play() : audio.pause(); }
};
(function tick() {
  if (td && $('follow').checked && !audio.paused) {
    const t = audio.currentTime;
    if (t < win.t0 || t > win.t0 + win.len) win.t0 = Math.max(0, Math.min(td.dur - win.len, t - win.len * 0.2));
  }
  draw();
  requestAnimationFrame(tick);
})();
window.onresize = draw;
</script>
</body>
</html>
