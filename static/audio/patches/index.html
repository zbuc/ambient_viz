<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>patches — audio tools</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
    #params { max-width: 560px; }
    .export { margin-top: 18px; max-width: 720px; }
    .export textarea {
      width: 100%; height: 180px; background: var(--panel-2); color: var(--fg);
      border: 1px solid var(--line); border-radius: 6px; padding: 10px;
      font: 12px/1.5 ui-monospace, monospace; resize: vertical;
    }
    #status { color: var(--muted); margin-left: auto; }
    .pill { font-size: 12px; padding: 3px 9px; border-radius: 11px; border: 1px solid var(--line); color: var(--muted); cursor: pointer; }
    .pill.online { color: #04201d; background: var(--accent); border-color: var(--accent); }
    .pill.offline { color: var(--muted); }
    #trigger:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>
  <header class="app-bar">
    <h1>patches</h1>
    <span class="spacer"></span>
    <a href="../index.html">← audio tools</a>
  </header>
  <main>
    <div class="toolbar">
      <label>voice
        <select id="voice"></select>
      </label>
      <label>preset
        <select id="preset"></select>
      </label>
      <button id="reset">Reset to default</button>
      <button id="trigger" title="Strike the voice on the preview server">Trigger ▶</button>
      <button id="stop" title="Kill all audio on the preview server">Stop ◼</button>
      <span id="live" class="pill" title="Native preview server (cargo run -p host --bin patch_server)">connecting…</span>
      <span id="status"></span>
    </div>

    <div id="params"></div>

    <div class="export">
      <label>export
        <select id="export-fmt">
          <option value="json">JSON</option>
          <option value="rust">Rust (FmPatch / BassPatch literal)</option>
        </select>
      </label>
      <textarea id="export-out" readonly></textarea>
      <div style="margin-top:8px;display:flex;gap:8px">
        <button id="copy">Copy</button>
        <button id="download" class="primary">Download</button>
      </div>
    </div>
  </main>
  <script type="module" src="patches.js"></script>
</body>
</html>
