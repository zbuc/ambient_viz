<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>instruments — audio tools</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    section.panel { border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 16px; background: var(--panel); }
    section.panel > h2 { margin: 0 0 10px; font-size: 14px; }
    section.panel > h2 .sub { color: var(--muted); font-weight: 400; }
    #params { max-width: 560px; }
    .export { margin-top: 14px; max-width: 720px; }
    .export textarea {
      width: 100%; height: 150px; background: var(--panel-2); color: var(--fg);
      border: 1px solid var(--line); border-radius: 6px; padding: 10px;
      font: 12px/1.5 ui-monospace, monospace; resize: vertical;
    }
    #status { color: var(--muted); margin-left: auto; }
    .pill { font-size: 12px; padding: 3px 9px; border-radius: 11px; border: 1px solid var(--line); color: var(--muted); cursor: pointer; }
    .pill.online { color: #04201d; background: var(--accent); border-color: var(--accent); }
    .pill.offline { color: var(--muted); }
    button:disabled, select:disabled { opacity: 0.4; cursor: default; }
    .fx-list { display: flex; flex-direction: column; gap: 10px; max-width: 560px; }
    .fx-card { border: 1px solid var(--line); border-radius: 6px; padding: 10px; background: var(--panel-2); }
    .fx-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .fx-head .name { font-weight: 600; text-transform: capitalize; }
    .fx-head .grow { flex: 1; }
    .fx-head button { padding: 1px 7px; }
    .fx-empty { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <header class="app-bar">
    <h1>instruments</h1>
    <span class="spacer"></span>
    <a href="../index.html">← audio tools</a>
  </header>
  <main>
    <div class="toolbar">
      <button id="trigger" title="Strike the current voice on the preview server">Trigger ▶</button>
      <button id="stop" title="Kill all audio on the preview server">Stop ◼</button>
      <span id="live" class="pill" title="Native preview server (cargo run -p host --bin patch_server)">connecting…</span>
      <span id="status"></span>
    </div>

    <!-- PATCH -->
    <section class="panel">
      <h2>Patch <span class="sub">· source voice</span></h2>
      <div class="toolbar">
        <label>voice <select id="voice"></select></label>
        <label>preset <select id="preset"></select></label>
        <button id="preset-save">Save patch preset…</button>
        <button id="preset-del" title="Delete the selected saved preset">🗑</button>
        <button id="reset">Reset</button>
        <button id="randomize" title="Roll every parameter randomly">🎲</button>
      </div>
      <div id="params"></div>
      <div class="export">
        <label>export
          <select id="export-fmt">
            <option value="json">JSON</option>
            <option value="rust">Rust (FmPatch / BassPatch literal)</option>
          </select>
        </label>
        <textarea id="export-out" readonly></textarea>
        <div style="margin-top:8px;display:flex;gap:8px">
          <button id="copy">Copy</button>
          <button id="download" class="primary">Download</button>
        </div>
      </div>
    </section>

    <!-- FX CHAIN -->
    <section class="panel">
      <h2>FX chain <span class="sub">· insert effects (needs the preview server)</span></h2>
      <div class="toolbar">
        <label>add <select id="fx-add-kind"></select></label>
        <button id="fx-add">+ Add effect</button>
        <label>preset <select id="fx-preset"></select></label>
        <button id="fx-preset-save">Save FX preset…</button>
        <button id="fx-preset-del" title="Delete the selected FX preset">🗑</button>
      </div>
      <div id="fx-list" class="fx-list"></div>
    </section>

    <!-- INSTRUMENT -->
    <section class="panel">
      <h2>Instrument <span class="sub">· patch + FX chain bundle</span></h2>
      <div class="toolbar">
        <label>preset <select id="inst-preset"></select></label>
        <button id="inst-load">Load</button>
        <button id="inst-del" title="Delete the selected instrument">🗑</button>
        <button id="inst-save" class="primary">Save instrument…</button>
      </div>
    </section>
  </main>
  <script type="module" src="instruments.js"></script>
</body>
</html>
