[package]
name = "dsp"
version = "0.1.0"
edition = "2024"
description = "Audio + MIDI core for ambient-viz-daisy. no_std, runs on both Daisy and Mac."

[features]
# Place `tape::TapeProcessor::process` in the firmware's `.itcm` linker section
# (zero-wait ITCM) for QSPI-XIP perf tuning. Firmware-only — enabled via the
# firmware `itcm-tape` feature; the Mac host build never sets it (the `.itcm`
# section is meaningless there). See memory `daisy-modular-itcm-perbuild`.
itcm-tape = []

[dependencies]
# DaisySP-equivalent no_std DSP library (reverbs, filters, delays, distortion,
# modulation, oscillators, etc.). Requires alloc — firmware crate provides a
# global allocator via embedded-alloc.
# `perf-approximations` swaps exact libm tan/sin/log/exp in the per-sample hot
# paths for cheap polynomial/bit-trick approximations — essential on the Daisy's
# Cortex-M7 (no hardware transcendental unit). These were our patches; upstream
# merged them behind this feature flag (PRs #46/#47/#48). The vendored copy is
# patched via the workspace `[patch.crates-io]` — see daisy/vendor/PATCHES.md.
infinitedsp-core = { version = "1.1", features = ["perf-approximations"] }

# Math primitives (sinf/cosf/powf/fabsf) — sin/cos/powf aren't in core for no_std.
# Used by our DaisySP ports (SVF, analog bass drum).
libm = "0.2"

# no_std JSON parser. Used by `dsp::timeline` so the same code parses the
# ambient-viz timeline sidecars on both Mac host and Daisy firmware.
# Default features include `heapless` for fixed-size collection support.
serde-json-core = "0.6"
serde = { version = "1.0", default-features = false, features = ["derive"] }
# Must match serde-json-core 0.6.0's transitive dep — it pins heapless 0.8
# (the master branch tracks 0.9 but isn't released yet). The `serde` feature
# lets WtPatch's wavetable-id fields (heapless::String) round-trip as JSON.
heapless = { version = "0.8", features = ["serde"] }
