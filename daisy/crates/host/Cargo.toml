[package]
name = "host"
version = "0.1.0"
edition = "2024"

[dependencies]
dsp = { path = "../dsp" }

cpal = "0.15"
anyhow = "1.0"

# CoreMIDI input via the same crate that targets ALSA/WinMM elsewhere.
# Daisy MIDI will come from UART, not midir — but the decoder + map in `dsp`
# is shared, so the engine handle_midi() call site stays identical.
midir = "0.10"

# Timeline JSON parsing is shared with firmware via `dsp::timeline`
# (serde-json-core). On the host we use full serde_json instead — the
# `patch_server` bin deserializes FmPatch/BassPatch from the browser editor's
# POST bodies (the patch structs derive serde in `dsp`).
serde_json = "1.0"

# Minimal blocking HTTP server for the `patch_server` bin — fits the host's
# existing synchronous cpal/midir architecture (no async runtime).
tiny_http = "0.12"

# `mp3` feature enables both the MP3 demuxer and the MPEG audio decoder.
# Add "wav"/"flac"/"ogg" here later if we want to load those formats too.
symphonia = { version = "0.5", features = ["mp3"] }
