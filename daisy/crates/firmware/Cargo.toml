[package]
name = "firmware"
version = "0.1.0"
edition = "2024"

[features]
# `debug-uart` (on by default) compiles the plain-text USART3 diagnostics: the
# boot log, the 1 Hz audio-health heartbeat, the ~5 s chip-temperature readout,
# and the panic-message print. Every `dbg_uart!` is a no-op without it, the UART
# is never initialised, and the panic handler just halts — so the production
# build (`--no-default-features`) carries zero debug UART traffic or code.
default = ["debug-uart", "sd-spi"]
debug-uart = []
# --- SD backend (pick EXACTLY one; `sd.rs` compile_error!s otherwise) --------
# `sd-spi` (default): SPI1 + embedded-sdmmc, for the 6-pin WWZMDiB prototype
# module. See daisy/BREAKOUT.md §4.3.
sd-spi = []
# `sd-sdmmc`: native SDMMC1 peripheral (embassy `Sdmmc`) bridged into the same
# embedded-sdmmc VolumeManager via a block_on adapter. Bus width auto-selects:
# 1-bit when `debug-uart` is on (4-bit needs D2/PC10, which is the USART3
# debug-TX pin — a hard collision), 4-bit otherwise. The production aliases
# (`--no-default-features`) get 4-bit; the debug `flash`/`bin` aliases get 1-bit.
# Still blocks the executor like SPI does — the true async/DMA win is the
# separate BACKLOG "async/DMA SD reads" item. Needs the SDMMC1-wired socket
# (Adafruit #4682 proto / GCT MEM2075 prod).
sd-sdmmc = []
# `freeze` (OFF by default) compiles the master "freeze" parallel send: the grain
# hold ring -> glitch tape -> return summed under the master. It's opt-in because
# we don't currently like how it sounds; without it (the default) the ring
# buffer, glitch tape, and the inbound CC24 -> freeze routing are all compiled
# out, leaving the master chain as tape -> limiter. Add `--features freeze` to a
# firmware build to bring it back.
freeze = []
# `bell` (OFF by default) compiles a high FM bell + ping-pong delay summed on
# top of the master *before* the limiter — a dry chime that sits over the
# post-tape backing track. Struck by inbound MIDI note-on. Without it the voice,
# its 0.25 s delay ring (~96 KB AXI heap), and the note-on routing compile out.
bell = []
# `voice` (OFF by default) compiles the "pain material" formant-speech utterance
# + its own reverb, summed on top of the master before the limiter (same slot as
# bell). Struck by an inbound ch2 MIDI note-on when the room empties. Without it
# the SpeechSynth, reverb (~40-50 KB AXI heap), phoneme tables, and ch2 routing
# compile out.
voice = []
# `qspi` (OFF) builds for XIP from external QSPI flash (app @ 0x90040000) via the
# Daisy bootloader instead of the 128 KB internal flash — lifts the flash ceiling
# so all features (bell+voice+...) fit at opt-s. build.rs swaps in memory-qspi.x;
# main sets VTOR. Flashed with dfu-util through the bootloader, not probe-rs. The
# internal-flash build (feature off) stays the deployable fallback (pared). See
# PLAN_QSPI_BOOTLOADER.md / BENCH_QSPI.md.
qspi = []
# `bench` (OFF) compiles per-DSP-stage cycle timing (DWT CYCCNT) into the audio
# callback, reported over RTT in the heartbeat — used to quantify the XIP cost of
# the QSPI port (pre/post). Zero cost when off (all instrumentation cfg'd out).
# See BENCH_QSPI.md. Pair with the features under test, e.g. `bell,voice,bench`.
bench = []
# `rtt-diag` (OFF) emits the audio-health + USB-capture heartbeat over RTT (the
# `info!("diag(rtt): …")` line) WITHOUT pulling in `debug-uart`. The point: read
# the capture-tee counters (usb_drop / usb_pktmax) over the SWD probe alone — no
# D2 serial adapter — while keeping the SD bus at FULL 4-bit, because `debug-uart`
# claims D2/PC10 (SDMMC1_D2) and forces the bus to 1-bit. Use this to benchmark
# live USB capture at production SD speed: `--features rtt-diag,sd-sdmmc`.
rtt-diag = []
# --- ITCM ram-function placement (per-build perf tuning) ---------------------
# `itcm` is the umbrella: it gates the boot-time copy_itcm() that relocates the
# `.itcm` section into the H750's zero-wait ITCM. Don't enable it directly —
# enable an `itcm-<stage>` below, each of which turns on `itcm` AND the matching
# dsp-crate placement feature. Which stages to relocate is a PER-BUILD, bench-
# driven decision (the XIP bottleneck is I-cache contention; moving the biggest
# cache-hog stage to ITCM both speeds it up and frees cache for the others). See
# BENCH_QSPI.md + memory `daisy-modular-itcm-perbuild`.
itcm = []
# Relocate `dsp::tape::TapeProcessor::process` (the dominant stage) to ITCM.
itcm-tape = ["itcm", "dsp/itcm-tape"]

[dependencies]
dsp = { path = "../dsp" }

# Pinned to a git rev because crates.io 0.2.3 depends on embassy-stm32 ^0.5.0
# while master has moved to 0.6.0 — mixing them produces a `links = "embassy-time"`
# conflict at resolve time. Bump this SHA together with the embassy patch
# revs in the workspace Cargo.toml.
daisy-embassy = { git = "https://github.com/daisy-embassy/daisy-embassy", rev = "0a217111c0d47e3ad542bb729343f52dfddee415", features = ["seed_1_2"] }

embassy-executor = { version = "0.7.0", features = [
    "arch-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
    "task-arena-size-32768",
] }
embassy-time = { version = "0.5.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_768",
    "generic-queue-8",
] }
embassy-stm32 = { version = "0.6.0", features = [
    "defmt",
    "stm32h750ib",
    "time-driver-tim5",
    "exti",
    "memory-x",
    "unstable-pac",
    "chrono",
] }
embassy-futures = "0.1.2"
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-usb = { version = "0.6.0", features = ["defmt"] }

cortex-m = { version = "0.7.7", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = { version = "0.7.0", features = ["device"] }
critical-section = "1.2.0"

defmt = "1.0.1"
# Non-blocking RTT: drop log bytes when the buffer is full instead of spinning
# until the host drains it. Blocking mode stalls whatever task is logging — fatal
# for the audio task (start_callback logs on each restart), which then underruns
# the SAI, errors, restarts, logs again → a restart storm = blown-out audio. It
# also hangs in the exhibit (DFU, no probe ever drains RTT). Drop-on-full instead.
defmt-rtt = { version = "1.0.0", features = ["disable-blocking-mode"] }
# Panic handler lives in src/debug.rs (prints panics over the debug UART), so
# panic-probe is intentionally absent — there must be exactly one #[panic_handler].

static_cell = "2.1.1"

# Global allocator. dsp pulls in infinitedsp which requires `alloc`, so the
# firmware crate must provide one. LlffHeap is the simpler of embedded-alloc's
# two heap implementations — fine for our allocation pattern (a few buffers
# at startup + reverb internal state, no per-frame allocation).
embedded-alloc = "0.6"

# SD card stack. SPI mode (SDMMC peripheral isn't usable with the
# 6-pin WWZMDiB modules; see daisy/BREAKOUT.md). embedded-sdmmc + the
# embedded-hal-bus ExclusiveDevice adapter wraps a blocking SpiBus +
# CS pin into the SpiDevice that SdCard::new expects.
embedded-hal = "1.0"
embedded-hal-bus = "0.3"
embedded-sdmmc = { version = "0.9", default-features = false, features = ["defmt-log"] }

# Lock-free SPSC ring buffer between the SD reader and the audio callback.
heapless = "0.8"
