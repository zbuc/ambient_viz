[workspace]
resolver = "3"
members = ["crates/dsp", "crates/firmware", "crates/host"]
# `cargo build` from the workspace root only builds the Mac-buildable crates.
# Firmware is built explicitly via `cargo firmware` / `cargo flash` / `cargo bin`
# (aliases in .cargo/config.toml) which pass `--target thumbv7em-none-eabihf`.
default-members = ["crates/dsp", "crates/host"]

# daisy-embassy is pinned to a git rev that depends on unreleased embassy
# changes. The patch below must match daisy-embassy's own patch.crates-io block.
# Bump these together with the daisy-embassy rev in crates/firmware/Cargo.toml.
[patch.crates-io]
# Vendored from infinitedsp main (github.com/Na1w/infinitedsp). Upstream merged
# our per-sample perf work behind the `perf-approximations` feature (PRs
# #44/#46/#47/#48 + the loop-invariant hoists), so the vendored copy now carries
# only the THREE changes upstream hasn't taken:
#   • synthesis/speech.rs           — voice formant de-ess + noise low-pass
#                                     (artistic tuning) + per-sample Stutter::tick
#   • effects/time/stutter.rs       — Stutter::tick + no-resize set_sample_rate
#                                     (the Vec-resize doubling blew the AXI heap)
#   • low_mem/.../reverb_low_mem.rs — scalar combs (wide::f32x4 has no HW SIMD
#                                     on the Cortex-M7)
# `perf-approximations` is enabled in crates/dsp/Cargo.toml. See
# vendor/PATCHES.md for the full rationale and the re-sync procedure.
infinitedsp-core = { path = "vendor/infinitedsp-core" }
embassy-stm32   = { git = "https://github.com/embassy-rs/embassy.git", rev = "2a1ea6766d00c867c717290d0bb31a8e3f237dca" }
embassy-time    = { git = "https://github.com/embassy-rs/embassy.git", rev = "2a1ea6766d00c867c717290d0bb31a8e3f237dca" }
embassy-sync    = { git = "https://github.com/embassy-rs/embassy.git", rev = "2a1ea6766d00c867c717290d0bb31a8e3f237dca" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git", rev = "2a1ea6766d00c867c717290d0bb31a8e3f237dca" }
embassy-usb     = { git = "https://github.com/embassy-rs/embassy.git", rev = "2a1ea6766d00c867c717290d0bb31a8e3f237dca" }

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
# Production/baseline stays size-balanced 's'. The *debug* firmware aliases
# (`firmware`/`flash`/`bin`) override this to 'z' via `--config` to squeeze
# `debug-uart + bell` under the 128 KB internal-flash ceiling — a TEMPORARY
# workaround to drop once QSPI lifts the limit. See .cargo/config.toml and
# PLAN_QSPI_BOOTLOADER.md.
opt-level = 's'
overflow-checks = false

# Keep the hot DSP crates FAST even when the debug/sdmmc aliases force the rest
# of the image to opt-level='z' (a flash-size workaround). opt-z slows these
# loops ~2x — measured cb_full 305 us → 671 us, which blows the 667 us SAI
# callback deadline (BLOCK_LENGTH=32 @ 48 kHz) and makes the audio glitch/
# underrun. These per-package overrides pin them at 's' (the exhibit-proven
# ~305 us) regardless of the profile-wide opt-level. Drop once QSPI lifts the
# ceiling and the 'z' workaround goes away. See PLAN_QSPI_BOOTLOADER.md.
[profile.release.package.dsp]
opt-level = 's'
[profile.release.package."infinitedsp-core"]
opt-level = 's'

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true
