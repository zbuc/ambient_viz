# Linker flags + runner for the Daisy target.
# These only activate when something is built for thumbv7em-none-eabihf
# (i.e. the firmware crate), so they're safe to leave at workspace scope —
# host builds for the Mac triple and ignores this block entirely.
[target.thumbv7em-none-eabihf]
runner = 'probe-rs run --chip STM32H750IBKx'
rustflags = [
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tdefmt.x",
  # ITCM ram-function section (INSERT AFTER .data); emitted by build.rs into
  # OUT_DIR. Empty/harmless unless a fn is tagged `link_section=".itcm"`.
  "-C", "link-arg=-Titcm.x",
  "-C", "target-cpu=cortex-m7",
]

# Affects defmt-rtt only (defmt is firmware-only); host ignores this var.
[env]
DEFMT_LOG = "debug"

# Workspace-scoped aliases so firmware commands work from the root.
# `cargo run -p host` for Mac dev — no alias needed; native target is default.
#
# The debug aliases (firmware/flash/bin, default features → `debug-uart`)
# override opt-level to 'z' via --config: size-first keeps `debug-uart + bell`
# under the H750's 128 KB internal-flash ceiling (~127 KB at 'z' vs an overflow
# at the profile default 's'). The PRODUCTION aliases below (flash-prod/bin-prod)
# deliberately omit this, so the shipping image keeps the profile's 's'. This is
# a TEMPORARY workaround — drop the --config once QSPI lifts the flash limit (see
# PLAN_QSPI_BOOTLOADER.md). Caveat: 'z' can slow hot DSP loops; watch
# CB_FULL_US / SAI_ERR on hardware.
[alias]
firmware = ["build", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--config", "profile.release.opt-level=\"z\""]
flash    = ["run",   "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--config", "profile.release.opt-level=\"z\""]
# `cargo bin` produces target/firmware.bin for DFU flashing.
# Requires `cargo install cargo-binutils` once.
bin = ["objcopy", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--config", "profile.release.opt-level=\"z\"", "--", "-O", "binary", "target/firmware.bin"]

# --- Production build ----------------------------------------------------
# `--no-default-features` drops the `debug-uart` feature: no USART3 boot log,
# health heartbeat, chip-temperature readout, or panic print — the shipping
# kiosk firmware carries zero debug UART traffic. `--features bell,voice` adds
# the entry chime + the "pain material" speech voice (the exhibit needs both).
# Use these instead of the plain `flash` / `bin` aliases when building the
# exhibit image. NOTE: debug-uart + bell + voice together overflow the 128 KB
# flash; the bell+voice exhibit image only fits WITHOUT debug-uart (these prod
# aliases) — ~112 KB, ~19 KB free. See PLAN_QSPI_BOOTLOADER.md for the lift.
#
# INVARIANT: flash-prod and bin-prod MUST stay in parity — same crate, target,
# profile, and feature flags. They differ ONLY in the action (probe-flash vs
# emit a .bin); both produce the identical shipping image. If you change the
# feature set or flags on one, change the other in the same edit.
#
# *** OVERFLOW: as of the DSP-opt-s audio fix (commit 4e789ac), bell+voice TOGETHER
# no longer fit the 128 KB internal flash at opt-s (overflow ~5 KB; measured
# 2026-06-09, see BENCH_QSPI.md). The full bell+voice exhibit image is now
# QSPI-ONLY — build it with `cargo bin-qspi` (XIP, app @ 0x90040000). These two
# aliases are kept as the canonical full-feature reference but WILL FAIL to link
# for internal flash. For an internal-flash deployment, pick a PARED variant
# below (bell OR voice — not both). ***
flash-prod = "run -p firmware --target thumbv7em-none-eabihf --release --no-default-features --features bell,voice,sd-spi"
bin-prod = "objcopy -p firmware --target thumbv7em-none-eabihf --release --no-default-features --features bell,voice,sd-spi -- -O binary target/firmware-prod.bin"

# --- PARED internal-flash production images (one of bell/voice, fits 128 KB) ---
# The full bell+voice set is QSPI-only (above), so a SHIPPING internal-flash image
# must drop one. Both pared sets fit at opt-s with sd-spi (measured 2026-06-09):
#   bell-only  : ~108 KB (comfortable)   voice-only : ~131 KB (≈100 B to spare)
# Choose by which interaction the degraded fallback should keep — the entry chime
# (bell) or the "pain material" speech (voice). INVARIANT: keep each flash-/bin-
# pair in parity. (voice + sd-sdmmc overflows by 240 B → sd-spi only for voice.)
flash-prod-bell  = "run -p firmware --target thumbv7em-none-eabihf --release --no-default-features --features bell,sd-spi"
bin-prod-bell    = "objcopy -p firmware --target thumbv7em-none-eabihf --release --no-default-features --features bell,sd-spi -- -O binary target/firmware-prod-bell.bin"
flash-prod-voice = "run -p firmware --target thumbv7em-none-eabihf --release --no-default-features --features voice,sd-spi"
bin-prod-voice   = "objcopy -p firmware --target thumbv7em-none-eabihf --release --no-default-features --features voice,sd-spi -- -O binary target/firmware-prod-voice.bin"

# --- SDMMC backend builds ------------------------------------------------
# Drive the native SDMMC1 peripheral instead of the SPI SD module (needs a
# socket wired to SDMMC1 D1-D6 — Adafruit #4682 proto / GCT MEM2075 prod; see
# BREAKOUT.md §4.3). `sd-sdmmc` auto-selects bus width: 1-bit with `debug-uart`
# (D2/PC10 is the USART3 debug-TX pin — hard collision), 4-bit without.
# HARDWARE-UNTESTED until the socket exists.
#
# The embassy SDMMC driver adds ~5-6 KB over the SPI path, so BOTH sdmmc images
# carry the opt-level='z' size workaround (like the debug `flash`/`bin` aliases)
# to fit the 128 KB internal flash — the 4-bit bell,voice image overflows by
# ~5 KB at 's' (measured with a FULL `cargo clean`; note `cargo clean -p firmware`
# is NOT enough — incremental state masks flash overflow). QSPI XIP is the real
# ceiling lift (PLAN_QSPI_BOOTLOADER.md); drop the 'z' override once it lands.
# Caveat: 'z' can slow hot DSP loops — watch CB_FULL_US / SAI_ERR on hardware.
#
# `flash-sdmmc` / `bin-sdmmc`: bring-up — debug-uart (so dbg_uart! logs print)
# ⇒ 1-bit. `flash-sdmmc-prod` / `bin-sdmmc-prod`: 4-bit exhibit image (bell,
# voice, no debug-uart). INVARIANT: keep each flash-/bin- pair in parity.
flash-sdmmc = ["run", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--no-default-features", "--features", "debug-uart,sd-sdmmc", "--config", "profile.release.opt-level=\"z\""]
bin-sdmmc = ["objcopy", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--no-default-features", "--features", "debug-uart,sd-sdmmc", "--config", "profile.release.opt-level=\"z\"", "--", "-O", "binary", "target/firmware-sdmmc.bin"]
flash-sdmmc-prod = ["run", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--no-default-features", "--features", "bell,voice,sd-sdmmc", "--config", "profile.release.opt-level=\"z\""]
bin-sdmmc-prod = ["objcopy", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--no-default-features", "--features", "bell,voice,sd-sdmmc", "--config", "profile.release.opt-level=\"z\"", "--", "-O", "binary", "target/firmware-sdmmc-prod.bin"]
# `flash-sdmmc-bulk-prod` / `bin-sdmmc-bulk-prod`: the exhibit image WITH live
# WebUSB-bulk capture — bell,voice + usb-bulk (vendor bulk IN audio for the
# browser's ?usbaudio=1, instead of the UAC iso source the Pi 4 VL805 can't
# clock). Same as flash-sdmmc-prod plus usb-bulk. INVARIANT: keep this flash-/bin-
# pair in parity (and matched to flash-sdmmc-prod minus the audio path).
flash-sdmmc-bulk-prod = ["run", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--no-default-features", "--features", "bell,voice,usb-bulk,sd-sdmmc", "--config", "profile.release.opt-level=\"z\""]
bin-sdmmc-bulk-prod = ["objcopy", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--no-default-features", "--features", "bell,voice,usb-bulk,sd-sdmmc", "--config", "profile.release.opt-level=\"z\"", "--", "-O", "binary", "target/firmware-sdmmc-bulk-prod.bin"]

# `flash-sdmmc-rtt`: USB-capture benchmark image. rtt-diag (heartbeat over the
# SWD probe, NO D2 adapter) + sd-sdmmc at FULL 4-bit (no debug-uart, so D2 stays
# SDMMC1_D2). probe-rs `run` streams the `diag(rtt):` line live — watch usb_drop
# / usb_pktmax while the Pi captures (`?mic=1`). This is the production SD timing,
# unlike flash-sdmmc (debug-uart ⇒ 1-bit). No bell/voice: isolates SD↔USB
# executor contention from DSP load.
flash-sdmmc-rtt = ["run", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--no-default-features", "--features", "rtt-diag,sd-sdmmc"]

# `flash-sdmmc-bulk`: WebUSB-bulk capture path (vendor 0xFF BULK IN instead of the
# UAC iso source) + rtt-diag, 4-bit SD. Use to test/benchmark live capture over
# navigator.usb on the Pi, where the UAC iso path is starved by the VL805
# (PLAN_USB_CAPTURE.md). probe-rs `run` streams the diag(rtt): heartbeat live.
flash-sdmmc-bulk = ["run", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--no-default-features", "--features", "usb-bulk,rtt-diag,sd-sdmmc"]

# `flash-sdmmc-lean`: UAC iso source stripped to a conformant single-iso-EP async
# source (no feedback EP) + rtt-diag, 4-bit SD. Cheap test of whether lighter iso
# load lets UAC+CDC survive on the Pi 4 VL805 before falling back to usb-bulk.
flash-sdmmc-lean = ["run", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--no-default-features", "--features", "usb-uac-lean,rtt-diag,sd-sdmmc"]

# --- QSPI XIP builds (run from external QSPI via the Daisy bootloader) --------
# No probe-rs `run` alias: the app is loaded into QSPI over the bootloader's USB
# DFU, NOT internal flash. Build the .bin, then load with:
#   dfu-util -a 0 -s 0x90040000:leave -D target/firmware-qspi.bin
# Then attach for RTT/logs over the STLINK: `probe-rs attach --chip STM32H750IBKx
# target/thumbv7em-none-eabihf/release/firmware`.
# opt-s everywhere (QSPI lifts the 128 KB ceiling, so NO opt-z workaround), and
# ALL features — the whole point of the port. `qspi` swaps the linker layout to
# 0x90040000 and sets VTOR.
bin-qspi = ["objcopy", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--no-default-features", "--features", "bell,voice,sd-sdmmc,qspi", "--", "-O", "binary", "target/firmware-qspi.bin"]
# Benchmark image: bell+voice+bench (per-stage DWT cycles over RTT) for the
# pre/post-QSPI comparison (BENCH_QSPI.md). NOTE: NO `freeze` — bell+voice+freeze
# together exceed the 504 KB AXI heap (bell ~172 K + voice ~204 K + freeze + tape
# > 504 K → alloc panic at boot). freeze's cost is tiny (~1087 cyc idle) and was
# measured on internal flash; it's not worth the heap to co-bench it here.
bin-qspi-bench = ["objcopy", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--no-default-features", "--features", "bell,voice,sd-sdmmc,qspi,bench", "--", "-O", "binary", "target/firmware-qspi-bench.bin"]
# Same as bin-qspi-bench PLUS `itcm-tape`: relocates TapeProcessor::process into
# zero-wait ITCM. Compare the `bench(cyc): tape=…` line against bin-qspi-bench to
# measure the ITCM win (tape itself + reduced I-cache contention on the others).
bin-qspi-bench-itcm = ["objcopy", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--no-default-features", "--features", "bell,voice,sd-sdmmc,qspi,bench,itcm-tape", "--", "-O", "binary", "target/firmware-qspi-bench-itcm.bin"]
# Debug image: same full feature set as bin-qspi PLUS `debug-uart`, so the
# `diag(rtt): cb_full=… sai_err=… sd_under=… peak=…` health heartbeat + panic
# message print over RTT (visible via `probe-rs attach`). This is the QSPI
# equivalent of the old `cargo flash` dev loop — voice/bell still fire only on
# MIDI (no bench auto-strike). `debug-uart` forces 1-bit SDMMC (D2/PC10 is the
# USART3 TX pin — hard collision); fine for debug. Flash is 8 MB on QSPI so the
# extra ~38 KB of debug-uart code is free (no opt-z needed). Workflow:
#   cargo bin-qspi-debug
#   <power-cycle USB>  dfu-util -a 0 -s 0x90040000:leave -D target/firmware-qspi-debug.bin
#   probe-rs attach --chip STM32H750IBKx target/thumbv7em-none-eabihf/release/firmware
bin-qspi-debug = ["objcopy", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--no-default-features", "--features", "debug-uart,bell,voice,sd-sdmmc,qspi", "--", "-O", "binary", "target/firmware-qspi-debug.bin"]

# --- One-shot build + arm-watcher + flash (the QSPI `cargo flash` equivalent) ---
# cargo aliases can't run shell directly, but `cargo run` invokes the target
# `runner` with the freshly-built ELF — so these override the runner to point at
# scripts/flash-qspi.sh, which objcopies the ELF, waits for the bootloader DFU
# window (POWER-CYCLE the Daisy when prompted), flashes with retries, and verifies
# the boot. `flash-qspi` = production set (no debug-uart). `flash-qspi-debug` adds
# debug-uart AND auto-attaches `probe-rs` for the live RTT heartbeat after boot.
# Run these from the `daisy/` workspace root (the runner path is relative to it).
# NOTE: the runner override MUST be the string form (`runner='bash …'`). The TOML
# *array* form (`runner=['bash',…]`) makes cargo refuse to merge the CLI `target`
# table over the one in this file ("failed to merge key `target`"). cargo splits
# the string on whitespace and appends the built ELF path as the final arg, so the
# script sees: $1 = mode, $2 = ELF.
flash-qspi = ["run", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--no-default-features", "--features", "bell,voice,sd-sdmmc,qspi", "--config", "target.thumbv7em-none-eabihf.runner='bash scripts/flash-qspi.sh noattach'"]
flash-qspi-debug = ["run", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--no-default-features", "--features", "debug-uart,bell,voice,sd-sdmmc,qspi", "--config", "target.thumbv7em-none-eabihf.runner='bash scripts/flash-qspi.sh attach'"]
