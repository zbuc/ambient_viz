# Linker flags + runner for the Daisy target.
# These only activate when something is built for thumbv7em-none-eabihf
# (i.e. the firmware crate), so they're safe to leave at workspace scope —
# host builds for the Mac triple and ignores this block entirely.
[target.thumbv7em-none-eabihf]
runner = 'probe-rs run --chip STM32H750IBKx'
rustflags = [
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tdefmt.x",
  "-C", "target-cpu=cortex-m7",
]

# Affects defmt-rtt only (defmt is firmware-only); host ignores this var.
[env]
DEFMT_LOG = "debug"

# Workspace-scoped aliases so firmware commands work from the root.
# `cargo run -p host` for Mac dev — no alias needed; native target is default.
#
# The debug aliases (firmware/flash/bin, default features → `debug-uart`)
# override opt-level to 'z' via --config: size-first keeps `debug-uart + bell`
# under the H750's 128 KB internal-flash ceiling (~127 KB at 'z' vs an overflow
# at the profile default 's'). The PRODUCTION aliases below (flash-prod/bin-prod)
# deliberately omit this, so the shipping image keeps the profile's 's'. This is
# a TEMPORARY workaround — drop the --config once QSPI lifts the flash limit (see
# PLAN_QSPI_BOOTLOADER.md). Caveat: 'z' can slow hot DSP loops; watch
# CB_FULL_US / SAI_ERR on hardware.
[alias]
firmware = ["build", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--config", "profile.release.opt-level=\"z\""]
flash    = ["run",   "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--config", "profile.release.opt-level=\"z\""]
# `cargo bin` produces target/firmware.bin for DFU flashing.
# Requires `cargo install cargo-binutils` once.
bin = ["objcopy", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--config", "profile.release.opt-level=\"z\"", "--", "-O", "binary", "target/firmware.bin"]

# --- Production build ----------------------------------------------------
# `--no-default-features` drops the `debug-uart` feature: no USART3 boot log,
# health heartbeat, chip-temperature readout, or panic print — the shipping
# kiosk firmware carries zero debug UART traffic. `--features bell,voice` adds
# the entry chime + the "pain material" speech voice (the exhibit needs both).
# Use these instead of the plain `flash` / `bin` aliases when building the
# exhibit image. NOTE: debug-uart + bell + voice together overflow the 128 KB
# flash; the bell+voice exhibit image only fits WITHOUT debug-uart (these prod
# aliases) — ~112 KB, ~19 KB free. See PLAN_QSPI_BOOTLOADER.md for the lift.
#
# INVARIANT: flash-prod and bin-prod MUST stay in parity — same crate, target,
# profile, and feature flags. They differ ONLY in the action (probe-flash vs
# emit a .bin); both produce the identical shipping image. If you change the
# feature set or flags on one, change the other in the same edit.
flash-prod = "run -p firmware --target thumbv7em-none-eabihf --release --no-default-features --features bell,voice,sd-spi"
bin-prod = "objcopy -p firmware --target thumbv7em-none-eabihf --release --no-default-features --features bell,voice,sd-spi -- -O binary target/firmware-prod.bin"

# --- SDMMC backend builds ------------------------------------------------
# Drive the native SDMMC1 peripheral instead of the SPI SD module (needs a
# socket wired to SDMMC1 D1-D6 — Adafruit #4682 proto / GCT MEM2075 prod; see
# BREAKOUT.md §4.3). `sd-sdmmc` auto-selects bus width: 1-bit with `debug-uart`
# (D2/PC10 is the USART3 debug-TX pin — hard collision), 4-bit without.
# HARDWARE-UNTESTED until the socket exists.
#
# The embassy SDMMC driver adds ~5-6 KB over the SPI path, so BOTH sdmmc images
# carry the opt-level='z' size workaround (like the debug `flash`/`bin` aliases)
# to fit the 128 KB internal flash — the 4-bit bell,voice image overflows by
# ~5 KB at 's' (measured with a FULL `cargo clean`; note `cargo clean -p firmware`
# is NOT enough — incremental state masks flash overflow). QSPI XIP is the real
# ceiling lift (PLAN_QSPI_BOOTLOADER.md); drop the 'z' override once it lands.
# Caveat: 'z' can slow hot DSP loops — watch CB_FULL_US / SAI_ERR on hardware.
#
# `flash-sdmmc` / `bin-sdmmc`: bring-up — debug-uart (so dbg_uart! logs print)
# ⇒ 1-bit. `flash-sdmmc-prod` / `bin-sdmmc-prod`: 4-bit exhibit image (bell,
# voice, no debug-uart). INVARIANT: keep each flash-/bin- pair in parity.
flash-sdmmc = ["run", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--no-default-features", "--features", "debug-uart,sd-sdmmc", "--config", "profile.release.opt-level=\"z\""]
bin-sdmmc = ["objcopy", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--no-default-features", "--features", "debug-uart,sd-sdmmc", "--config", "profile.release.opt-level=\"z\"", "--", "-O", "binary", "target/firmware-sdmmc.bin"]
flash-sdmmc-prod = ["run", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--no-default-features", "--features", "bell,voice,sd-sdmmc", "--config", "profile.release.opt-level=\"z\""]
bin-sdmmc-prod = ["objcopy", "-p", "firmware", "--target", "thumbv7em-none-eabihf", "--release", "--no-default-features", "--features", "bell,voice,sd-sdmmc", "--config", "profile.release.opt-level=\"z\"", "--", "-O", "binary", "target/firmware-sdmmc-prod.bin"]
